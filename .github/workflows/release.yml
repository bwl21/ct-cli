name: Release

# Triggered by pushing a version tag (e.g. `v0.1.0`). Runs the same
# lint/typecheck/test/build gate as CI, then packages the built CLI as an
# npm-pack tarball and publishes it as a GitHub Release with
# auto-generated release notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package release tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz "release/ct-cli-${GITHUB_REF_NAME}.tgz"

      - name: Write install note
        run: |
          cat > release/INSTALL.md <<EOF
          # Installing ct ${GITHUB_REF_NAME}

          \`\`\`bash
          npm install -g ./ct-cli-${GITHUB_REF_NAME}.tgz
          \`\`\`

          Or directly from the release asset URL:

          \`\`\`bash
          npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ct-cli-${GITHUB_REF_NAME}.tgz
          \`\`\`

          Verify with:

          \`\`\`bash
          ct --help
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ct-cli-${{ github.ref_name }}.tgz
            release/INSTALL.md
